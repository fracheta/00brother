<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>00brother | Acessar Painel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        :root {
            --azul-corporativo: #1a2a3a;
            --azul-medio: #2c3e50;
            --dourado: #c9a84c;
            --dourado-claro: #dfc27d;
            --branco: #ffffff;
            --cinza-claro: #f1f3f5;
            --cinza-texto: #5a6a7a;
            --sombra-suave: 0 8px 30px rgba(0, 0, 0, 0.06);
            --sombra-media: 0 15px 40px rgba(0, 0, 0, 0.1);
            --borda: 16px;
            --transicao: 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f6f8 0%, #e9ecef 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            color: var(--azul-medio);
            -webkit-font-smoothing: antialiased;
        }

        /* Card principal */
        .login-card {
            background: var(--branco);
            width: 100%;
            max-width: 440px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            padding: 2.5rem 2rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        .login-card .logo-mini {
            font-size: 2rem;
            font-weight: 700;
            color: var(--azul-corporativo);
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        .login-card .logo-mini i {
            color: var(--dourado);
            margin-right: 0.5rem;
        }

        .login-card h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--azul-corporativo);
            margin-bottom: 0.5rem;
        }

        .login-card p.lead {
            font-size: 0.95rem;
            color: var(--cinza-texto);
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        /* Formulário */
        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 0.4rem;
            color: var(--azul-medio);
        }

        .input-field {
            position: relative;
        }

        .input-field i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aab4;
            font-size: 1rem;
            transition: color var(--transicao);
        }

        .input-field input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border: 1px solid #dce1e6;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            transition: all var(--transicao);
            background: #f9fafb;
            color: var(--azul-corporativo);
        }

        .input-field input:focus {
            outline: none;
            border-color: var(--dourado);
            box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.15);
            background: #fff;
        }

        .input-field input:focus + i,
        .input-field input:focus ~ i {
            color: var(--dourado);
        }

        /* Ajuste para o ícone ficar após o input? Não, o ícone está antes. Só focar no input muda cor do ícone via seletor de irmão não funciona diretamente. Vou usar o foco no contêiner ou usar jQuery. Vou resolver com CSS: o ícone é irmão adjacente? Não, é filho da div. Vou alterar a estrutura ou usar uma classe. Melhor: colocar o ícone como irmão anterior e usar seletor de foco com `:focus-within`. */
        .input-field:focus-within i {
            color: var(--dourado) !important;
        }

        .forgot-password {
            text-align: right;
            margin-bottom: 1.5rem;
        }

        .forgot-password a {
            font-size: 0.85rem;
            color: var(--cinza-texto);
            text-decoration: none;
            font-weight: 500;
            transition: color var(--transicao);
        }

        .forgot-password a:hover {
            color: var(--dourado);
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: var(--azul-corporativo);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all var(--transicao);
            box-shadow: 0 8px 20px rgba(26, 42, 58, 0.3);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-login:hover {
            background: #0f1e2c;
            box-shadow: 0 12px 28px rgba(26, 42, 58, 0.4);
            transform: translateY(-2px);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: #b0bec5;
            font-size: 0.8rem;
            margin: 1.5rem 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e0e4e8;
        }

        .create-account-link {
            display: inline-block;
            padding: 12px 24px;
            border: 2px solid var(--azul-corporativo);
            border-radius: 12px;
            color: var(--azul-corporativo);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all var(--transicao);
            width: 100%;
            text-align: center;
        }

        .create-account-link:hover {
            background: var(--azul-corporativo);
            color: white;
        }

        .back-home {
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }

        .back-home a {
            color: var(--dourado);
            text-decoration: none;
            font-weight: 500;
            transition: color var(--transicao);
        }

        .back-home a:hover {
            color: #b8943a;
        }

        /* Responsividade extra */
        @media (max-width: 480px) {
            .login-card {
                padding: 2rem 1.5rem;
            }
            .login-card h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-mini">
            <i class="fa-solid fa-handshake"></i> 00brother
        </div>
        <h1>Acessar Painel</h1>
        <p class="lead">Entre com suas credenciais de gestor</p>

        <!-- Formulário de Login (leva para 3.html ao submeter) -->
        <form action="3.html" method="get">
            <div class="input-group">
                <label for="email">E-mail institucional</label>
                <div class="input-field">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" name="email" placeholder="ex: nome@orgao.gov.br" required>
                </div>
            </div>
            <div class="input-group">
                <label for="senha">Senha</label>
                <div class="input-field">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="senha" name="senha" placeholder="••••••••" required>
                </div>
            </div>
            <div class="forgot-password">
                <a href="#">Esqueceu a senha?</a>
            </div>
            <button type="submit" class="btn-login">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Entrar
            </button>
        </form>

        <div class="divider">ou</div>

        <!-- Link para criar conta -->
        <a href="4.html" class="create-account-link">
            <i class="fa-solid fa-user-plus"></i> Criar nova conta
        </a>

        <div class="back-home">
            <a href="1.html"><i class="fa-solid fa-arrow-left"></i> Voltar para a página inicial</a>
        </div>
    </div>
</body>
</html>
