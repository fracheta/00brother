<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Abertura Responsiva</title>
  <style>
    /* Reset básico */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .splash img {
      max-width: 90%;
      height: auto;
    }

    /* Responsividade extra */
    @media (min-width: 768px) {
      .splash img {
        max-width: 400px;
      }
    }
  </style>
  <script>
    // Redireciona para 1.html após 5 segundos
    setTimeout(function() {
      window.location.href = "1.html";
    }, 5000);
  </script>
</head>
<body>
  <!-- Tela de abertura com a nova logo -->
  <div class="splash">
    <img src="logo.jpeg" alt="Logo de abertura">
  </div>
</body>
</html>
