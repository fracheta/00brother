    <style>
        :root { --azul-corporativo: #1a2a3a; --dourado: #c9a84c; --branco: #ffffff; --cinza-texto: #5a6a7a; }

        body { font-family: 'Poppins', sans-serif; background: #f5f6f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
        .page-card { background: var(--branco); border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15); padding: 3rem 2rem; text-align: center; max-width: 500px; width: 100%; }
        .page-card i { font-size: 3rem; color: var(--dourado); margin-bottom: 1rem; }
        .page-card h1 { font-size: 2rem; color: var(--azul-corporativo); margin-bottom: 0.5rem; }
        .page-card p { color: var(--cinza-texto); margin-bottom: 2rem; }
        .btn-back { display: inline-block; padding: 12px 24px; background: var(--azul-corporativo); color: white; border-radius: 12px; text-decoration: none; font-weight: 600; transition: 0.3s; }
        .btn-back:hover { background: #0f1e2c; }
    </style>
</head>
