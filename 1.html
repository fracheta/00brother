<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>00brother - Boas-Vindas</title>
  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #ffffff; /* branco predominante (60%) */
      font-family: Arial, sans-serif;
      color: #000000; /* preto (30%) */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .logo {
      max-width: 300px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 15px;
      color: #000000;
    }

    p {
      font-size: 1.2em;
      margin-bottom: 40px;
      color: #333333;
      max-width: 600px;
    }

    .btn {
      padding: 14px 28px;
      font-size: 1.1em;
      background-color: #89CFF0; /* azul bebê profissional (10%) */
      color: #000000;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background-color: #6bbbe0;
      transform: scale(1.05);
    }

    footer {
      position: absolute;
      bottom: 0;
      width: 100%;
      background-color: #000000; /* preto */
      color: #ffffff;
      text-align: center;
      padding: 10px;
      font-size: 0.9em;
    }

    @media (min-width: 768px) {
      .logo {
        max-width: 400px;
      }
      h1 {
        font-size: 3em;
      }
      p {
        font-size: 1.4em;
      }
      .btn {
        font-size: 1.2em;
      }
    }
  </style>
</head>
<body>
  <!-- Tela de boas-vindas -->
  <img src="logo.jpeg" alt="Logo da empresa" class="logo">
  <h1>Bem-vindo, Gestor</h1>
  <p>00brother é uma empresa dedicada ao desenvolvimento de aplicativos e projetos voltados para o impacto social e a melhoria da sociedade.</p>
  <button class="btn" onclick="window.location.href='principal.html'">Entrar no Painel</button>

  <footer>
    © 2026 00brother - Plataforma exclusiva para gestores
  </footer>
</body>
</html>
